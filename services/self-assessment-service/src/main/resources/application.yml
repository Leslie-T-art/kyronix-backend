server:
  port: 8090
spring:
  application:
    name: self-assessment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/kyronic_platform
    username: kyronic
    password: kyronic
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: self_assessment_service
  flyway:
    enabled: true
    default-schema: self_assessment_service
    schemas: self_assessment_service
    table: self_assessment_service_schema_history
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
security:
  jwt:
    secret: kyronic-local-jwt-signing-secret-2026
springdoc:
  swagger-ui:
    path: /swagger-ui.html
kyronic:
  audit:
    service-url: http://localhost:8083

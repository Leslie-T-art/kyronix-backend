server:
  port: 8082
spring:
  application:
    name: olts-service
  datasource:
    url: jdbc:postgresql://localhost:5433/kyronic_platform
    username: kyronic
    password: kyronic
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
springdoc:
  swagger-ui:
    path: /swagger-ui.html
